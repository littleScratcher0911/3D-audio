<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>3D Audio Demo</title>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; text-align: center; }
    #container { margin: 32px auto; width: 500px; }
    canvas { background: #333; display: block; margin: 0 auto; border: 2px solid #666; }
    #controls { margin-top: 16px; }
  </style>
</head>
<body>
  <div id="container">
    <h2>3D Audio Demo</h2>
    <canvas id="area" width="500" height="500"></canvas>
    <div id="controls">
      <button id="play">Play Sound</button>
      <button id="stop">Stop</button>
    </div>
    <p>
      Ziehe den Punkt über die Fläche.<br>
      Die Position bestimmt, woher das Geräusch kommt.<br>
      <small>(Kopfhörer empfohlen!)</small>
    </p>
  </div>
  <script>
    // Audio-Konfiguration
    let ctx = null, source = null, panner = null, gainNode = null;
    let playing = false;
    let buffer = null;

    // Lade ein Soundbeispiel (Du kannst eine eigene Datei verwenden)
    async function loadAudio() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const response = await fetch("audio-from-video.wav");
      const arrayBuffer = await response.arrayBuffer();
      buffer = await ctx.decodeAudioData(arrayBuffer);
    }

    async function playAudio() {
      if (!ctx) await loadAudio();
      if (playing) return;
      source = ctx.createBufferSource();
      source.buffer = buffer;
      panner = ctx.createPanner();
      panner.panningModel = 'HRTF';
      panner.distanceModel = 'linear';
      panner.refDistance = 1;
      panner.maxDistance = 10;
      gainNode = ctx.createGain();
      source.connect(panner).connect(gainNode).connect(ctx.destination);
      source.loop = true;
      source.start();
      playing = true;
      updatePanner();
    }

    function stopAudio() {
      if (source) source.stop();
      playing = false;
    }

    // Canvas-Konfiguration
    const canvas = document.getElementById("area");
    const ctx2d = canvas.getContext("2d");
    const areaW = canvas.width, areaH = canvas.height;
    const center = {x: areaW/2, y: areaH/2};
    let dot = {x: areaW/2, y: areaH/2, r: 18};
    let dragging = false;

    function draw() {
      ctx2d.clearRect(0, 0, areaW, areaH);
      // Hilfslinien
      ctx2d.strokeStyle = "#888";
      ctx2d.lineWidth = 2;
      ctx2d.beginPath();
      ctx2d.moveTo(center.x, 0); ctx2d.lineTo(center.x, areaH); // vertikal
      ctx2d.moveTo(0, center.y); ctx2d.lineTo(areaW, center.y); // horizontal
      ctx2d.stroke();

      // Markierungen
      ctx2d.fillStyle = "#fff";
      ctx2d.font = "18px sans-serif";
      ctx2d.fillText("Vorne", center.x-28, 30);
      ctx2d.fillText("Hinten", center.x-35, areaH-15);
      ctx2d.fillText("Links", 10, center.y-10);
      ctx2d.fillText("Rechts", areaW-70, center.y-10);
      ctx2d.fillStyle = "#ff0";
      ctx2d.fillText("Mitte", center.x-30, center.y-30);

      // Punkt
      ctx2d.beginPath();
      ctx2d.arc(dot.x, dot.y, dot.r, 0, Math.PI*2);
      ctx2d.fillStyle = "#0af";
      ctx2d.fill();
      ctx2d.strokeStyle = "#fff";
      ctx2d.lineWidth = 3;
      ctx2d.stroke();
    }

    function updatePanner() {
      if (!panner) return;
      // Normiere Koordinaten: -1 bis 1
      let relX = (dot.x - center.x) / (areaW/2);
      let relY = (dot.y - center.y) / (areaH/2);
      // Web Audio: x=links/rechts, z=vor/hinten (neg. z ist vorne)
      panner.positionX.value = relX * 2; // -2 bis 2
      panner.positionY.value = 0;
      panner.positionZ.value = relY * 2; // -2 bis 2
      // Lautstärke verringern, je weiter hinten
      if (gainNode) gainNode.gain.value = 1 - Math.abs(relY) * 0.5;
    }

    // Drag & Drop Punkt
    canvas.addEventListener("mousedown", (e) => {
      let rect = canvas.getBoundingClientRect();
      let mx = e.clientX - rect.left, my = e.clientY - rect.top;
      if (Math.hypot(mx-dot.x, my-dot.y) <= dot.r) dragging = true;
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      let rect = canvas.getBoundingClientRect();
      dot.x = Math.max(dot.r, Math.min(areaW-dot.r, e.clientX - rect.left));
      dot.y = Math.max(dot.r, Math.min(areaH-dot.r, e.clientY - rect.top));
      draw();
      updatePanner();
    });
    window.addEventListener("mouseup", () => dragging = false);

    // Buttons
    document.getElementById("play").onclick = playAudio;
    document.getElementById("stop").onclick = stopAudio;

    // Initial
    draw();
  </script>
</body>
</html>
